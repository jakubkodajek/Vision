<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Vision app mark: the single source for every app icon and the DMG artwork.
    Same geometry as LogoMark in src/components/primitives.tsx (tile, two arcs, pupil),
    with the default iris accent from src/styles/tokens.css.
    Regenerate the rendered files with: python3 scripts/make_icons.py
    The renderer supports only what this file uses: linearGradient, rect, path (M C c S s L l Z),
    circle, hex colours.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#6159ea"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect id="tile-shape" width="32" height="32" rx="9" fill="url(#tile)"/>
  <path d="M6 16c2.8-4.9 6.1-7.3 10-7.3s7.2 2.4 10 7.3" fill="none" stroke="#fbf8f3" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M6 16c2.8 4.9 6.1 7.3 10 7.3s7.2-2.4 10-7.3" fill="none" stroke="#fbf8f3" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.6" fill="#fbf8f3"/>
</svg>
