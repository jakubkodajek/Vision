name: Build installers

# Builds unsigned (macOS: ad-hoc signed) installers for every platform on pull requests
# and pushes to main, and uploads them as workflow artifacts. A pushed tag `v*` also
# creates a draft GitHub Release with every installer and a SHA256SUMS file.
# No secrets are used. Third-party actions are pinned to full commit SHAs
# (tests/config/installers.test.ts enforces this).

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: make check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch: arm64
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # Oldest supported Ubuntu runner: the AppImage and deb link against its glibc.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build HiDPI DMG background
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/dmg
          tiffutil -cathidpicheck src-tauri/icons/dmg/background.png \
            src-tauri/icons/dmg/background@2x.png -out target/dmg/background.tiff

      - name: Build installers
        env:
          # tauri-bundler passes --skip-jenkins to bundle_dmg.sh when CI=true, which skips
          # the Finder AppleScript that writes the DMG layout (tauri-apps/tauri#1731).
          # GitHub's macOS images grant osascript and bash Apple Events access to Finder
          # (actions/runner-images configure-tccdb-macos.sh), so let it run. If Finder
          # refuses, bundle_dmg.sh exits 64 and the job fails instead of shipping a plain
          # DMG; "Verify DMG" checks the stored layout. Ignored on Windows and Linux.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          args=(--target "$TARGET" --bundles "${{ matrix.bundles }}")
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Relative to src-tauri, where the Tauri CLI runs the bundler.
            args+=(--config '{"bundle":{"macOS":{"dmg":{"background":"../target/dmg/background.tiff"}}}}')
          fi
          npx tauri build "${args[@]}"

      - name: Verify DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls target/"$TARGET"/release/bundle/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          ls -la "$mnt"
          test -d "$mnt/Vision.app"
          test -L "$mnt/Applications"
          test "$(readlink "$mnt/Applications")" = "/Applications"
          codesign -dv "$mnt/Vision.app" 2>&1 | tee codesign.txt
          grep -q '^Signature=adhoc' codesign.txt
          codesign --verify --deep --strict --verbose=2 "$mnt/Vision.app"
          archs=$(lipo -archs "$mnt/Vision.app/Contents/MacOS/vision")
          echo "architectures: $archs"
          test "$archs" = "${{ matrix.arch }}"
          min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$mnt/Vision.app/Contents/Info.plist")
          echo "LSMinimumSystemVersion: $min"
          test "$min" = "12.0"
          python3 scripts/check_dmg_layout.py "$mnt" src-tauri/tauri.conf.json

      - name: Collect installers
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            macOS) patterns="dmg/*.dmg" ;;
            Windows) patterns="nsis/*-setup.exe msi/*.msi" ;;
            Linux) patterns="deb/*.deb appimage/*.AppImage" ;;
          esac
          mkdir -p installers
          for pattern in $patterns; do
            set -- $bundle/$pattern
            if [ ! -e "$1" ]; then echo "::error::no installer matches $bundle/$pattern"; exit 1; fi
            cp "$@" installers/
          done
          ls -la installers

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vision-${{ matrix.name }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vision-*
          path: installers
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: installers
        run: |
          set -euo pipefail
          ls -la
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Vision $TAG" \
            --generate-notes
