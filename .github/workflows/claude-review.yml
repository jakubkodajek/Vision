# Independent AI review on every PR (a second opinion, separate from the agents that
# wrote the code). Disabled until you set the repository variable
# ENABLE_CLAUDE_REVIEW=true (Settings -> Secrets and variables -> Actions -> Variables)
# and add the ANTHROPIC_API_KEY secret. It follows REVIEW.md and CLAUDE.md.
# Docs: https://code.claude.com/docs/en/github-actions#run-a-skill
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.ENABLE_CLAUDE_REVIEW == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
