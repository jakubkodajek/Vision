[package]
name = "vision-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vision domain logic. No UI or Tauri dependency."

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
keyring = "4"
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
ts-rs = "12"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["std", "job-object"] }

[dev-dependencies]
tempfile = "3"

# Test fixture: a fake CLI / fake MCP server used only by the integration tests.
[[bin]]
name = "vision-test-fake"
path = "tests/bin/fake.rs"
test = false
doc = false
